# Internal PKI: a self-signed bootstrap issuer mints the lab root CA, and the
# CA issuer signs every certificate in the cluster. Trust the root CA on the
# Mac with `task trust-ca`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: igaming-lab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: iGaming Lab Root CA
  secretName: igaming-lab-root-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: igaming-lab-ca
spec:
  ca:
    secretName: igaming-lab-root-ca
