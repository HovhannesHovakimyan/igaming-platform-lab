# The edge: one shared Gateway for *.igaming.lab, exposed on host ports 80/443
# through the k3d load balancer. Plain HTTP is redirected to HTTPS.
apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-igaming-lab
  namespace: edge
spec:
  secretName: wildcard-igaming-lab-tls
  dnsNames:
    - igaming.lab
    - "*.igaming.lab"
  duration: 2160h # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  # macOS rejects TLS server certificates without the serverAuth EKU.
  usages:
    - server auth
    - digital signature
  issuerRef:
    name: igaming-lab-ca
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: igaming
  namespace: edge
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.igaming.lab"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-igaming-lab-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: edge
spec:
  parentRefs:
    - name: igaming
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
