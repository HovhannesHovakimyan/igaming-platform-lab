# Secrets live in (LocalStack) AWS Secrets Manager and are synced into the
# cluster by External Secrets, as they would be on EKS.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: localstack-aws-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: localstack-aws-creds
            namespace: external-secrets
            key: secret-access-key
---
# End-to-end check: Terraform (infra/terraform/localstack) writes
# igaming/platform/smoke; this pulls it into a Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-smoke
  namespace: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-smoke
  data:
    - secretKey: message
      remoteRef:
        key: igaming/platform/smoke
        property: message
