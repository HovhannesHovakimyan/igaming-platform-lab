apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        # Point the AWS provider at LocalStack instead of real AWS.
        extraEnv:
          - name: AWS_SECRETSMANAGER_ENDPOINT
            value: http://localstack.localstack.svc.cluster.local:4566
          - name: AWS_STS_ENDPOINT
            value: http://localstack.localstack.svc.cluster.local:4566
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
